apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: calendarapp
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/drschlaubi/hsfulda-argocd-demo/calendar-app-chart
    targetRevision: 1.0.7
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
