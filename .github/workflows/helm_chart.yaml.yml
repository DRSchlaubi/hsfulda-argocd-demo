name: Helm Chart
on:
  push:
    branches:
      - main
    paths:
      - calendar-chart
      - .github/workflows/helm_chart.yaml.yml
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Chart | Push
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: calendar-app-chart
          repository: drschlaubi/hsfulda-argocd-demo
          tag: 1.0.${{ github.run_number }}
          path: calendar-chart
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          update_dependencies: true
