apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: calendar-app
spec:
  interval: 24h
  url: oci://ghcr.io/drschlaubi/hsfulda-argocd-demo/calendar-app-chart
  ref:
    semver: "1.x"
---
kind: HelmRelease
apiVersion: helm.toolkit.fluxcd.io/v2
metadata:
  name: calendar-app
spec:
  releaseName: calendar-app
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: calendar-app
