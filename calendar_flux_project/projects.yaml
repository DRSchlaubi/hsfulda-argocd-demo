apiVersion: v1
kind: Namespace
metadata:
  name: calendar-app
---
kind: Kustomization
apiVersion: kustomize.toolkit.fluxcd.io/v1
metadata:
  name: calendar-app
  namespace: calendar-app
spec:
  interval: 5m
  path: ./calendar_flux_project/calendar-app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
